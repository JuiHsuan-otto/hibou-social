# Publishes approved @lovehibou Threads posts from social/queue.json through the
# official Threads API. No browser is involved; the token exists only as the
# HIBOU_THREADS_TOKEN repository secret.
#
# Schedule (GitHub cron is UTC). Runs are often 5–30 minutes late, and on
# 2026-11-25 and 2026-11-26 every threads-publish cron from 18:45 through 21:32
# Taipei was dropped. Evening slots therefore have several off-peak crons.
# Avoid :00 and :30, when GitHub is most congested. Duplicate checks in
# publish.py make a re-run harmless.
#
#   Taipei     UTC      what
#   07:10      23:10    check only (account, token age, quota, queue health)
#   07:45      23:45    morning catch-up
#   12:45      04:45    noon catch-up (Facebook 12:20 / Instagram 12:25 included)
#   18:10      10:10    18:05 article promos, first evening chance
#   18:25      10:25    18:05 redundancy
#   18:45      10:45    evening catch-up
#   18:50      10:50    18:05 redundancy (still inside the 90-minute window, which closes 19:35)
#   19:20      11:20    18:05 redundancy, last cron inside the 90-minute window
#   19:50      11:50    article-promo late window only (18:05 + 3h closes 21:05; a 20:00 post is not due yet)
#   20:10      12:10    20:00 posts; an 18:05 article promo is still inside its 3h late window
#   20:25      12:25    20:00 redundancy (off-peak; 20:10 and 20:40 were both dropped on 11/25 and 11/26)
#   20:40      12:40    20:00 catch-up; 18:05 article promo still before 21:05
#   21:05      13:05    20:00 redundancy, still before the 21:30 close
#   21:32      13:32    bedtime post
#   22:05      14:05    bedtime catch-up. Article promos are not sent after 22:30 Taipei.
#
# Kill switch: unless the repository variable THREADS_PUBLISH_ENABLED is "true",
# every publish run is forced to dry-run (the one exception is a manual run of a
# test entry that Otto approved).
#
# The same run also looks at Facebook and Instagram entries in social/queue.json.
# Those stay a dry-run unless FB_PUBLISH_ENABLED / IG_PUBLISH_ENABLED is "true"
# and the workflow is running on main. A missing page token or Instagram id
# skips that platform and does not change the Threads posts. The cron above
# is the Threads schedule and is not used to add new posting times.

name: threads-publish

on:
  schedule:
    - cron: "10 23 * * *"
    - cron: "45 23 * * *"
    - cron: "45 4 * * *"
    - cron: "10 10 * * *"
    - cron: "25 10 * * *"
    - cron: "45 10 * * *"
    - cron: "50 10 * * *"
    - cron: "20 11 * * *"
    - cron: "50 11 * * *"
    - cron: "10 12 * * *"
    - cron: "25 12 * * *"
    - cron: "40 12 * * *"
    - cron: "5 13 * * *"
    - cron: "32 13 * * *"
    - cron: "5 14 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "check (read-only) or publish"
        type: choice
        default: check
        options: [check, publish]
      dry_run:
        description: "publish mode only: show what would be sent, send nothing"
        type: boolean
        default: true
      entry_id:
        description: "publish mode only: send just this queue entry"
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: hibou-threads-publish
  cancel-in-progress: false

jobs:
  run:
    name: ${{ github.event_name == 'schedule' && (github.event.schedule == '10 23 * * *' && 'check (scheduled)' || 'publish (scheduled)') || inputs.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mask Meta secrets
        env:
          HIBOU_FB_PAGE_TOKEN: ${{ secrets.HIBOU_FB_PAGE_TOKEN }}
          HIBOU_IG_USER_ID: ${{ secrets.HIBOU_IG_USER_ID }}
        run: |
          set -euo pipefail
          if [ -n "${HIBOU_FB_PAGE_TOKEN}" ]; then echo "::add-mask::${HIBOU_FB_PAGE_TOKEN}"; fi
          if [ -n "${HIBOU_IG_USER_ID}" ]; then echo "::add-mask::${HIBOU_IG_USER_ID}"; fi

      - name: Run
        env:
          HIBOU_THREADS_TOKEN: ${{ secrets.HIBOU_THREADS_TOKEN }}
          HIBOU_THREADS_USERNAME: ${{ vars.HIBOU_THREADS_USERNAME }}
          HIBOU_THREADS_USER_ID: ${{ vars.HIBOU_THREADS_USER_ID }}
          HIBOU_THREADS_TOKEN_ISSUED: ${{ vars.HIBOU_THREADS_TOKEN_ISSUED }}
          THREADS_PUBLISH_ENABLED: ${{ vars.THREADS_PUBLISH_ENABLED }}
          HIBOU_FB_PAGE_TOKEN: ${{ secrets.HIBOU_FB_PAGE_TOKEN }}
          HIBOU_IG_USER_ID: ${{ secrets.HIBOU_IG_USER_ID }}
          HIBOU_FB_PAGE_ID: ${{ vars.HIBOU_FB_PAGE_ID }}
          FB_PUBLISH_ENABLED: ${{ vars.FB_PUBLISH_ENABLED }}
          IG_PUBLISH_ENABLED: ${{ vars.IG_PUBLISH_ENABLED }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_ENTRY_ID: ${{ inputs.entry_id }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "schedule" ]; then
            if [ "$EVENT_SCHEDULE" = "10 23 * * *" ]; then args=(check); else args=(publish); fi
          else
            args=("$INPUT_MODE")
            if [ "$INPUT_MODE" = "publish" ]; then
              if [ "$INPUT_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
              if [ -n "$INPUT_ENTRY_ID" ]; then args+=(--entry-id "$INPUT_ENTRY_ID"); fi
            fi
          fi
          python3 social/publish.py "${args[@]}"
